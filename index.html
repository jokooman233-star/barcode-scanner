
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>운송장 바코드 스캐너</title>
<script src="https://unpkg.com/@zxing/browser@0.1.5"></script>
<style>
body {font-family:Arial,sans-serif;text-align:center;padding:20px}
video {width:100%;max-width:500px;background:#222}
button {padding:14px 22px;margin:8px;font-size:17px}
input {padding:13px;width:90%;max-width:350px}
#msg {margin:20px;font-size:17px}
</style>
</head>
<body>
<h2>운송장 바코드 스캔</h2>
<p>인증키를 입력하고 카메라를 시작하세요.</p>

<input id="apiKey" type="password" placeholder="기존 API 인증키 입력">
<br><br>
<video id="video" playsinline muted></video>
<br>
<button id="start">카메라 시작</button>
<button id="stop">카메라 중지</button>
<div id="msg">대기 중</div>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbyPxJNRQxI96zndyBuzY3xwU3QWLbBbA4QHAxaX5nelFYSTs842Ix58rXhmS2dyKPOL/exec";

const video = document.getElementById("video");
const msg = document.getElementById("msg");
const keyInput = document.getElementById("apiKey");

let reader = null;
let controls = null;
let busy = false;
let lastNumber = "";
  function playBeep() {
  const audio = new AudioContext();
  const oscillator = audio.createOscillator();
  const gain = audio.createGain();

  oscillator.frequency.value = 1200;
  gain.gain.value = 0.15;

  oscillator.connect(gain);
  gain.connect(audio.destination);

  oscillator.start();
  oscillator.stop(audio.currentTime + 0.12);

  oscillator.onended = () => audio.close();
}

async function startCamera() {
  if (!keyInput.value.trim()) {
    msg.textContent = "인증키를 먼저 입력하세요.";
    return;
  }

  if (!window.ZXingBrowser) {
    msg.textContent = "바코드 라이브러리 로딩 실패";
    return;
  }

  try {
    reader = new ZXingBrowser.BrowserMultiFormatReader();
    msg.textContent = "카메라 연결 중...";

    controls = await reader.decodeFromConstraints(
      {video: {facingMode: "environment"}},
      video,
      (result, error) => {
        if (!result || busy) return;

        const number = result.getText().trim();

        if (!/^\d{8}-\d+$/.test(number)) {
          msg.textContent = "운송장 형식 확인: " + number;
          return;
        }

        if (number === lastNumber) return;

        busy = true;
lastNumber = number;
playBeep();
sendNumber(number);
      }
    );

    msg.textContent = "카메라 작동 중";
  } catch (e) {
    msg.textContent = "카메라 오류: " + e.message;
  }
}

async function sendNumber(number) {
  msg.textContent = "전송 요청 중: " + number;

  try {
    await fetch(API_URL, {
      method: "POST",
      mode: "no-cors",
      headers: {
        "Content-Type": "text/plain;charset=UTF-8"
      },
      body: JSON.stringify({
        action: "submit",
        key: keyInput.value.trim(),
        number: number
      })
    });

    msg.textContent = "전송 요청 완료: " + number +
      " (시트에서 등록 여부 확인)";
  } catch (e) {
    msg.textContent = "전송 오류: " + e.message;
  }

  setTimeout(() => {
    busy = false;
    msg.textContent = "다음 운송장을 스캔하세요.";
  }, 500);
}

function stopCamera() {
  if (controls) controls.stop();

  if (video.srcObject) {
    video.srcObject.getTracks().forEach(track => track.stop());
    video.srcObject = null;
  }

  controls = null;
  busy = false;
  msg.textContent = "카메라 중지";
}

document.getElementById("start").onclick = startCamera;
document.getElementById("stop").onclick = stopCamera;
</script>
</body>
</html>
